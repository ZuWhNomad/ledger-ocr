[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-ocr"
version = "0.2.0"
description = "Offline OCR: any document -> ledger table (CSV/XLSX) or plain text. Nothing leaves the machine."
requires-python = ">=3.10"
dependencies = [
  "pdfplumber>=0.11",    # PDF text layer + page rasterizing (pypdfium2, Apache)
  "openpyxl>=3.1",       # xlsx in/out
  "pillow>=10",
  # Windows built-in OCR (no external program to install)
  "winrt-runtime>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Globalization>=3.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
extras = ["python-docx>=1.1", "pillow-heif>=0.16", "pytesseract>=0.3.10"]
dev = ["pytest>=8", "reportlab>=4.0", "ledger-ocr[extras]"]

[project.scripts]
run-ledger-ocr = "ledger_ocr.cli:main"

[tool.setuptools]
packages = ["ledger_ocr"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.setuptools.package-data]
ledger_ocr = ["static/*.html"]
