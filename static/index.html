<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR-Pipeline — Statement to Spreadsheet</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --ink:#e2e8f0; --mut:#94a3b8;
          --accent:#38bdf8; --warn:#f59e0b; --warnbg:#42260a; --ok:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 28px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:18px; } h1 span{ color:var(--accent); }
  .sub { color:var(--mut); font-size:12px; margin-top:4px; }
  main { max-width:1100px; margin:0 auto; padding:24px 28px; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:48px 24px; text-align:center;
          background:var(--card); cursor:pointer; transition:.15s; }
  #drop.hot { border-color:var(--accent); background:#0b3a4a; }
  #drop h2 { margin:0 0 6px; font-size:16px; } #drop p{ color:var(--mut); margin:4px 0; }
  .opts { display:flex; gap:20px; flex-wrap:wrap; align-items:center; margin:18px 0; color:var(--mut); }
  .opts label { display:flex; gap:6px; align-items:center; cursor:pointer; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .on { color:var(--ok); border-color:var(--ok); } .off{ color:var(--mut); }
  #status { margin:16px 0; min-height:20px; }
  .summary { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .chip b { color:var(--accent); }
  .chip.warn b { color:var(--warn); }
  .dl { margin:14px 0; display:flex; gap:10px; }
  button, .btn { background:var(--accent); color:#04222e; border:0; padding:9px 16px; border-radius:8px;
          font-weight:600; cursor:pointer; font-size:13px; }
  .btn.sec { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; position:sticky; top:0; background:var(--bg); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.flagged { background:var(--warnbg); }
  .flagtext { color:var(--warn); font-size:12px; } .llm{ color:var(--accent); font-size:12px; }
  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  .err { color:var(--warn); }
</style>
</head>
<body>
<header>
  <h1><span>OCR</span>-Pipeline &mdash; bank statement / ledger &rarr; spreadsheet</h1>
  <div class="sub">Runs entirely on your machine. No cloud. PDF, or scan/image (PNG/JPG/TIFF).</div>
</header>
<main>
  <div id="drop">
    <h2>Drop a PDF or image here</h2>
    <p>or click to choose a file</p>
    <input type="file" id="file" hidden accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.gif">
  </div>

  <div class="opts">
    <label><input type="checkbox" id="llm"> Error-check with local LLM</label>
    <span>strategy:
      <select id="strategy" style="background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;">
        <option value="words">words (default)</option>
        <option value="lines">lines</option>
      </select></span>
    <span id="envOcr" class="badge off">OCR: ?</span>
    <span id="envLlm" class="badge off">LLM: ?</span>
  </div>

  <div id="status"></div>
  <div id="summary" class="summary"></div>
  <div id="dl" class="dl"></div>
  <div id="result"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), fileEl = $('#file');

fetch('/api/env').then(r=>r.json()).then(e=>{
  const o=$('#envOcr'), l=$('#envLlm');
  o.textContent='OCR: '+(e.ocr_available?'ready':'not installed'); o.className='badge '+(e.ocr_available?'on':'off');
  l.textContent='LLM: '+(e.llm_available?e.llm_model:'off'); l.className='badge '+(e.llm_available?'on':'off');
}).catch(()=>{});

drop.onclick = ()=> fileEl.click();
fileEl.onchange = ()=> fileEl.files[0] && upload(fileEl.files[0]);
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hot');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hot');}));
drop.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) upload(f); });

function b64ToBlob(b64, mime){ const bin=atob(b64); const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:mime}); }
function dlBtn(label, b64, mime, name){
  const a=document.createElement('a'); a.className='btn'; a.textContent=label;
  a.href=URL.createObjectURL(b64ToBlob(b64,mime)); a.download=name; return a;
}

async function upload(file){
  $('#summary').innerHTML=''; $('#dl').innerHTML=''; $('#result').innerHTML='';
  $('#status').innerHTML = 'Processing <b>'+file.name+'</b> &hellip;';
  const qs = new URLSearchParams({ strategy:$('#strategy').value, llm: $('#llm').checked?'1':'0' });
  try{
    const r = await fetch('/api/process?'+qs, { method:'POST',
      headers:{'X-Filename':file.name}, body:file });
    const d = await r.json();
    if(!d.ok){ $('#status').innerHTML = '<span class="err">'+ (d.error||'failed') +'</span>'; return; }
    render(d);
  }catch(err){ $('#status').innerHTML = '<span class="err">'+err+'</span>'; }
}

function render(d){
  const s=d.summary;
  $('#status').innerHTML = 'Done &mdash; route: <b>'+d.route+'</b>, strategy: <b>'+s.strategy+'</b>';
  const chips=[
    ['rows', s.rows], ['with balance', s.rows_with_balance],
    ['convention', s.sign_convention.replace(/_/g,' ')],
  ];
  let html = chips.map(c=>`<div class="chip">${c[0]}: <b>${c[1]}</b></div>`).join('');
  if(s.balance_checked===false){
    html += `<div class="chip">balance: <b>not checked</b></div>`;
  } else {
    html += `<div class="chip ${s.balance_mismatches?'warn':''}">balance mismatches: <b>${s.balance_mismatches}</b></div>`;
  }
  if(s.llm && s.llm.enabled) html += `<div class="chip">LLM checked: <b>${s.llm.checked}</b> (${s.llm.model})</div>`;
  $('#summary').innerHTML = html;

  const base=(d.filename||'result').replace(/\.[^.]+$/,'');
  if(d.csv_b64) $('#dl').appendChild(dlBtn('Download CSV', d.csv_b64,'text/csv', base+'.csv'));
  if(d.xlsx_b64) $('#dl').appendChild(dlBtn('Download XLSX', d.xlsx_b64,
     'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', base+'.xlsx'));

  const cols=['date','description','debit','credit','amount','balance'];
  let t='<div class="tablewrap"><table><thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'<th>notes</th></tr></thead><tbody>';
  for(const row of d.rows){
    const flagged = !!row.flag;
    t+='<tr class="'+(flagged?'flagged':'')+'">';
    for(const c of cols){
      const num = (c==='debit'||c==='credit'||c==='amount'||c==='balance');
      t+=`<td class="${num?'num':''}">${escapeHtml(row[c]||'')}</td>`;
    }
    let note = flagged ? `<span class="flagtext">${escapeHtml(row.flag)}</span>` : '';
    if(row.llm) note += ` <span class="llm">[LLM: ${escapeHtml(row.llm)}]</span>`;
    t+=`<td>${note}</td></tr>`;
  }
  t+='</tbody></table></div>';
  $('#result').innerHTML=t;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
</body>
</html>
